<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --primary-color: #4361ee;
    --light-bg: #f8f9fa;
}

body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

.login-card {
    background: white;
    border-radius: 15px;
    padding: 2.5rem 3rem;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border-left: 5px solid var(--primary-color);
    width: 100%;
    max-width: 450px; /* Augmenté de 400px à 450px */
}

.login-header {
    text-align: center;
    margin-bottom: 2rem;
}

.login-title {
    font-size: 2rem; /* Légèrement plus grand */
    font-weight: 700;
    background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}

.login-subtitle {
    color: #6c757d;
    font-size: 1rem; /* Légèrement plus grand */
}

.form-control {
    border-radius: 10px;
    border: 2px solid #e9ecef;
    padding: 0.85rem 1rem; /* Plus de padding */
    font-size: 1rem;
    transition: all 0.3s;
}

.form-control:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
}

.btn-primary {
    background: var(--primary-color);
    border: none;
    border-radius: 10px;
    padding: 0.85rem; /* Plus de padding */
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s;
    margin-top: 0.5rem;
}

.btn-primary:hover {
    background: #3651d4;
    transform: translateY(-2px);
    box-shadow: 0 7px 14px rgba(67, 97, 238, 0.2);
}

.form-label {
    font-weight: 500;
    color: #495057;
    margin-bottom: 0.5rem;
    font-size: 1rem;
}

.error-message {
    background: rgba(239, 71, 111, 0.1);
    color: #ef476f;
    padding: 1rem; /* Plus de padding */
    border-radius: 8px;
    text-align: center;
    margin-top: 1rem;
    border: 1px solid rgba(239, 71, 111, 0.2);
    font-size: 0.95rem;
}

.icon-input {
    position: relative;
}

.icon-input i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: #6c757d;
    z-index: 1;
    font-size: 1.1rem; /* Icônes légèrement plus grandes */
}

.icon-input input {
    padding-left: 3.5rem; /* Plus d'espace pour les icônes */
}

.back-link {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e9ecef;
}

.back-link a {
    color: var(--primary-color);
    text-decoration: none;
    font-size: 0.95rem;
}

.back-link a:hover {
    text-decoration: underline;
}

/* Espacement amélioré */
.mb-3 {
    margin-bottom: 1.5rem !important; /* Plus d'espace entre les champs */
}
</style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <h3 class="login-title">
            <i class="fas fa-sign-in-alt me-2"></i>Connexion
        </h3>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <div class="icon-input">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control" required placeholder="Entrez votre nom d'utilisateur">
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <div class="icon-input">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" class="form-control" required placeholder="Entrez votre mot de passe">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
        </button>
    </form>
    
    {% if form.errors %}
    <div class="error-message">
        <i class="fas fa-exclamation-circle me-2"></i>Nom d'utilisateur ou mot de passe incorrect
    </div>
    {% endif %}
    
    <div class="back-link">
        <a href="{% url 'home' %}">
            <i class="fas fa-arrow-left me-1"></i>Retour à la page publique
        </a>
    </div>
</div>
</body>
</html>
