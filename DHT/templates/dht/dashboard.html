<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Chain Monitoring</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
.main-card { border-radius: 15px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); background-color: white; }
.small-card { border-radius: 12px; padding: 20px; color: white; text-align: center; transition: transform 0.3s, box-shadow 0.3s; }
.small-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
.display-4 { font-size: 2.5rem; font-weight: bold; }
.timestamp { color: #555; font-size: 0.95rem; text-align: center; margin-top: 15px; }
.bg-temp { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.bg-hum { background: linear-gradient(135deg, #43e97b, #38f9d7); }
.dashboard-title { font-size: 2.8rem; font-weight: 700; color: #1a237e; text-align: center; margin-bottom: 30px; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
</style>
</head>
<body>
<div class="container mt-5">
    <h2 class="dashboard-title">Cold Chain Monitoring</h2>
    <div class="main-card mx-auto col-md-8">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="small-card bg-temp shadow">
                    <h5>Température</h5>
                    <p class="display-4" id="temp">0 °C</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="small-card bg-hum shadow">
                    <h5>Humidité</h5>
                    <p class="display-4" id="hum">0 %</p>
                </div>
            </div>
        </div>
        <p class="timestamp" id="timestamp">Dernière mise à jour : -</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function fetchLatest() {
    try {
        const response = await fetch('/api/latest/');
        if (!response.ok) throw new Error('Erreur API');
        const data = await response.json();
        document.getElementById('temp').textContent = data.temp.toFixed(1) + ' °C';
        document.getElementById('hum').textContent = data.humidity.toFixed(1) + ' %';
        const dt = new Date(data.dt);
        document.getElementById('timestamp').textContent = 'Dernière mise à jour : ' + dt.toLocaleString();
    } catch (err) {
        console.error(err);
    }
}

// Rafraîchit toutes les 10 secondes
fetchLatest();
setInterval(fetchLatest, 10000);
</script>
</body>
</html>
